[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "environment-maintenance"
version = "5.1.0"
description = "Configured environment maintenance and named application groups"
requires-python = ">=3.11"
dependencies = [
    "command-execution==0.1.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "setuptools>=65",
    "wheel",
]

[project.scripts]
start-app = "environment_maintenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
