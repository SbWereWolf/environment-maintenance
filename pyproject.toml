[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "environment-maintenance"
version = "5.3.3"
description = "Configured environment maintenance and named application groups"
requires-python = ">=3.11"
dependencies = [
    "command-execution==2.0.3",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "setuptools>=65",
    "wheel",
]

[project.scripts]
start-app = "environment_maintenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
environment_maintenance = ["resources/commands/*"]
