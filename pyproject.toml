[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "environment-maintenance"
version = "4.1.0"
description = "Configured environment maintenance and named application groups"
requires-python = ">=3.11"
dependencies = [
    "jsonpatch>=1.36",
    "jsonpointer>=3.4",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "setuptools>=65",
    "wheel",
]

[project.scripts]
start-app = "environment_maintenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
