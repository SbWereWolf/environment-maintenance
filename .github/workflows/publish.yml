name: Publish environment-maintenance
on:
  push:
    tags: ['v[0-9]*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release gates and maintained smoke
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -I -B tests/test_release_contract.py -v
          if [[ -n "$RELEASE_TAG" ]]; then
            python -I -B .github/scripts/release.py validate --tag "$RELEASE_TAG"
          fi
          python -m pip install -e '.[dev]'
          mkdir "$RUNNER_TEMP/em-wheelhouse" "$RUNNER_TEMP/em-package-tests"
          mapfile -t runtime_requirements < <(python -c 'import tomllib; print(*tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"], sep="\n")')
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/em-wheelhouse" setuptools wheel "${runtime_requirements[@]}"
          export ENVIRONMENT_MAINTENANCE_PYTHON=$(command -v python)
          export ENV2_PACKAGE_TEST_ROOT="$RUNNER_TEMP/em-package-tests"
          export ENV2_PACKAGE_WHEELHOUSE="$RUNNER_TEMP/em-wheelhouse"
          python -B -m pytest -p no:cacheprovider -q tests/test_command_package_extraction.py tests/test_npm_delivery.py tests/test_npm_persistent_entry.py
          bash tests/smoke.sh "$(command -v python)"
      - name: Build both distributions
        env:
          RELEASE_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error
  pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release/
      - run: |
          mkdir dist
          mv release/*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Verify published wheel
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, time, urllib.error, urllib.request

          wheel, = Path("dist").glob("*.whl")
          package, version, *_ = wheel.name.split("-")
          expected = hashlib.sha256(wheel.read_bytes()).hexdigest()
          url = f"https://pypi.org/pypi/{package.replace('_', '-')}/{version}/json"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      files = json.load(response)["urls"]
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  files = []
              actual = next((f["digests"]["sha256"] for f in files if f["filename"] == wheel.name), None)
              if actual is not None:
                  if actual != expected:
                      raise SystemExit("Published wheel does not match the built artifact")
                  break
              time.sleep(5)
          else:
              raise SystemExit("Published wheel is unavailable")
          PYTHON
  npm:
    needs: pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release/
      - run: npm install --global npm@11.15.0
      - name: Publish and verify npm artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          archive=(./release/*.tgz)
          test "${#archive[@]}" -eq 1
          registry_decision() {
            env -u GITHUB_OUTPUT python -I -B .github/scripts/release.py registry \
              --tag "$RELEASE_TAG" --tarball "${archive[0]}" | jq -er '.decision'
          }
          decision=$(registry_decision)
          if [[ "$decision" == publish ]]; then
            npm publish "${archive[0]}" --access public
            deadline=$((SECONDS + 25 * 60))
            while [[ "$decision" == publish ]] && (( SECONDS < deadline )); do
              printf 'Waiting for npm to make %s public\n' "$RELEASE_TAG"
              sleep 30
              decision=$(registry_decision)
            done
          fi
          if [[ "$decision" != already-published ]]; then
            printf 'npm did not make %s public within 25 minutes.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
