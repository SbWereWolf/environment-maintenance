[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "command-execution"
version = "0.2.0"
description = "Independent configured command and configuration APIs"
requires-python = ">=3.11"
dependencies = [
    "jsonpatch>=1.36",
    "jsonpointer>=3.4",
]

[tool.setuptools.packages.find]
where = ["src"]
